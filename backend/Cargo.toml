[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
arti-client = { version = "0.45.0", features = [
  "onion-service-service",
  "onion-service-client",
  "experimental-api",
] }
chrono = "0.4.45"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["tokio-macros", "net", "rt"] }
uniffi = { version = "0.32.0", features = ["cli"] }
rusqlite = { version = "0.36.0", features = ["bundled"] }
tor-rtcompat = "0.45.0"
tor-hsservice = "0.45.0"
tokio-tungstenite = "0.30.0"
futures = "0.3.33"
rand = "0.10.2"
tor-cell = "0.45.0"
safelog = "0.9.1"

[build-dependencies]
uniffi = { version = "0.32.0", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
